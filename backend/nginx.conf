# Mushia Hostel - Nginx Reverse Proxy Configuration
# Place this file in /etc/nginx/sites-available/mushia.conf (Linux)
# or in your Nginx conf directory.

upstream django_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream vite_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost mushiahostel.com www.mushiahostel.com;

    # Maximum upload size for hostel images/documents
    client_max_body_size 20M;

    # Gzip Compression for fast page loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 1. Django API Endpoints (/api/)
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ensure HttpOnly cookies (access_token, refresh_token) are passed seamlessly
        proxy_pass_header Set-Cookie;
        proxy_cookie_domain django_backend $host;
        proxy_cookie_path / /;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. Django Admin Portal (/admin/)
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass_header Set-Cookie;
    }

    # 3. Django Static Files (Admin CSS, JS, images)
    location /static/ {
        alias /var/www/mush-backend/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 4. Django Media Files (Uploaded room photos, assets)
    location /media/ {
        alias /var/www/mush-backend/media/;
        expires 30d;
        access_log off;
    }

    # 5. Frontend (React/Vite)
    # Option A: In Development (Proxying to Vite dev server)
    location / {
        proxy_pass http://vite_frontend;
        proxy_http_version 1.1;

        # WebSocket support for Vite HMR (Hot Module Replacement)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Option B: In Production (Serving compiled Vite static build 'dist')
    # Uncomment the following block when running 'pnpm build' in production:
    # location / {
    #     root /var/www/mush-frontend/dist;
    #     index index.html;
    #     try_files $uri $uri/ /index.html;
    #     expires 1h;
    # }
}
